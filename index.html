<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Tabletop League</title>
<style>
:root{--bg:#101522;--panel:#192235;--panel2:#202c42;--line:#2b3850;--ink:#f4f2ec;--muted:#aab4c5;--gold:#e4bd70;--gold2:#b98d43;--green:#8fc7a2;--red:#e58c87}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% -10%,#29344b 0,transparent 42%),var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1120px;margin:auto;padding:28px 20px 60px}.hero{border:1px solid #3b465a;border-radius:22px;padding:28px;background:linear-gradient(120deg,#222e43,#151d2d 70%);box-shadow:0 18px 55px #0004}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.17em}.season{border:1px solid #566078;border-radius:99px;padding:6px 11px;color:#d5dbea;font-size:12px}
h1{font-size:clamp(29px,5vw,48px);letter-spacing:-.045em;line-height:1.03;margin:18px 0 9px}.sub{color:var(--muted);margin:0}.stats{display:flex;gap:34px;margin-top:25px}.stat strong{display:block;font-size:25px}.stat span{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tab,.btn,.smallbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:11px;padding:10px 15px;font-weight:650;cursor:pointer}.tab.active{background:var(--gold);border-color:var(--gold);color:#1a1d24}.btn.primary{background:var(--gold);color:#1b2029;border-color:var(--gold)}.btn:hover,.tab:hover,.smallbtn:hover{filter:brightness(1.12)}button:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{background:linear-gradient(160deg,#1c273a,#172133);border:1px solid var(--line);border-radius:17px;padding:18px;min-width:0}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.card h2,.section-title{margin:0;font-size:19px}.pill{border:1px solid #46536a;border-radius:99px;padding:4px 9px;color:var(--muted);font-size:11px;white-space:nowrap}
.rows{display:grid;gap:10px}.rankrow{display:grid;grid-template-columns:25px minmax(0,1fr) 90px;align-items:center;gap:9px}.rank{color:var(--gold);font-weight:800}.player{font-weight:650;overflow:hidden;text-overflow:ellipsis}.score{font-weight:800;font-size:21px;text-align:right;font-variant-numeric:tabular-nums}.bar{height:4px;background:#303c51;border-radius:10px;overflow:hidden;margin-top:5px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:10px}
.muted{color:var(--muted)}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed #46536a;border-radius:13px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}.select,input{background:#111a29;border:1px solid #3a4962;color:var(--ink);padding:11px 12px;border-radius:10px;font:inherit;min-width:0}.select{width:100%}label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:6px}.field{display:grid;gap:6px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.scoreinputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.scoreinputs input{width:100%}
.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:440px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line)}th{font-size:11px;letter-spacing:.08em;color:var(--muted)}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.big{font-weight:850;font-size:20px}.winner{color:var(--gold)}.match{margin-top:12px}.matchhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.matchtitle{font-weight:750}.resultline{display:grid;grid-template-columns:30px 1fr 90px;gap:8px;padding:7px 0;border-top:1px solid #2b3850}.resultline .num{text-align:right;font-weight:750;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);margin-top:12px}.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px;color:var(--muted);font-size:12px}.smallbtn{font-size:12px;padding:7px 10px}.orderbtn{width:30px;height:30px;padding:0;border:1px solid var(--line);background:#111a29;color:var(--ink);border-radius:8px;cursor:pointer}.orderbtn:disabled{opacity:.3;cursor:not-allowed}.danger{color:var(--red)}#syncStatus[data-kind="success"]{color:var(--green)}#syncStatus[data-kind="error"]{color:var(--red)}.notice{background:#2a281f;border:1px solid #665638;color:#e8d6ae;padding:12px 14px;border-radius:12px;margin:16px 0;font-size:13px}
@media(max-width:700px){.wrap{padding:16px 13px 40px}.grid{grid-template-columns:1fr}.stats{gap:22px}.formgrid,.scoreinputs{grid-template-columns:1fr}.hero{padding:22px}.rankrow{grid-template-columns:22px 1fr 78px}.score{font-size:19px}}
</style>
</head>
<body><main class="wrap">
<header class="hero">
 <div class="top"><div class="eyebrow">THE GROUP CHAMPIONSHIP</div><div class="season">SEASON 01 · 2026</div></div>
 <h1>THE TABLETOP<br><span style="color:var(--gold)">LEAGUE</span></h1>
 <p class="sub">Five games. Four players. One table.</p>
 <div class="stats"><div class="stat"><strong id="playerCount">4</strong><span>PLAYERS</span></div><div class="stat"><strong id="matchCount">0</strong><span>MATCHES PLAYED</span></div><div class="stat"><strong id="gameCount">5</strong><span>GAMES</span></div></div>
</header>
<nav class="tabs" aria-label="Main navigation">
 <button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="games">Game results</button><button class="tab" data-tab="add">Add a match</button><button class="tab" data-tab="league">League table</button><button class="tab" data-tab="manage">Manage games</button>
</nav>
<div id="syncStatus" class="note" role="status">Connecting to shared league…</div><div id="view"></div>
<div class="footer"><span>Scores are ranked highest to lowest. Ties share the same rank.</span><span><button class="smallbtn" id="exportBtn">Export backup</button> <button class="smallbtn" id="importBtn">Import backup</button> <input id="importFile" type="file" accept="application/json" hidden></span></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://fgnkwsntlkmgfuqduvio.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_cqd7m29b-TpXBDgibxGnUQ_jYBGG0cT";
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const DEFAULT_GAMES=["Catan","Azul","Splendor","Root","Finspan"];
let PLAYERS=["Aravinda","Namrata","Swarnabh","Kishalay"], GAMES=DEFAULT_GAMES.slice(), gameRows=[], playerRows=[], matches=[];
let tab="overview", selectedGame="Catan", loading=true, realtimeReady=false, refreshing=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function setStatus(message,kind="muted"){const el=$("#syncStatus");if(el){el.textContent=message;el.dataset.kind=kind;}}
function gameId(name){return gameRows.find(g=>g.name===name)?.id;}
function total(game,player){return matches.filter(m=>m.game===game).reduce((sum,m)=>sum+(Number(m.scores[player])||0),0);}
function rankRows(game){let arr=PLAYERS.map((name,i)=>({name,score:total(game,i)})).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));let max=Math.max(0,...arr.map(x=>x.score));return arr.map((x,i)=>({...x,rank:i===0?1:x.score===arr[i-1].score?arr[i-1].rank:i+1,width:max?x.score/max*100:0}));}
function gameCard(g){let rows=rankRows(g),count=matches.filter(m=>m.game===g).length;return `<section class="card"><div class="cardhead"><h2>${esc(g)}</h2><span class="pill">${count} ${count===1?"match":"matches"}</span></div><div class="rows">${rows.map(r=>`<div class="rankrow"><div class="rank">${r.rank===1?"①":r.rank===2?"②":r.rank===3?"③":"④"}</div><div><div class="player">${esc(r.name)}</div><div class="bar"><i style="width:${r.width}%"></i></div></div><div class="score">${r.score.toLocaleString("en-IN")}</div></div>`).join("")}</div><div class="note">Cumulative points · highest total leads</div></section>`}
function sortedMatch(m){return m.scores.map((score,i)=>({name:PLAYERS[i],score:Number(score)})).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));}
function matchCard(m,index,withActions=true){let rows=sortedMatch(m);return `<section class="card match"><div class="matchhead"><div><div class="matchtitle">${esc(m.game)} · Match ${index+1}</div><div class="muted" style="font-size:12px">${esc(m.date)}</div></div>${withActions?`<button class="smallbtn danger" data-delete="${esc(m.id)}">Delete</button>`:""}</div>${rows.map((r,i)=>`<div class="resultline"><div class="${i===0?"winner":"muted"}">${i===0?"1st":i===1?"2nd":i===2?"3rd":"4th"}</div><div>${esc(r.name)}</div><div class="num">${r.score.toLocaleString("en-IN")}</div></div>`).join("")}</section>`}
function render(){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));$("#matchCount").textContent=matches.length;$("#gameCount").textContent=GAMES.length;let v=$("#view");
if(tab==="overview"){v.innerHTML=`<div class="cardhead"><div><h2 class="section-title">Game leaderboards</h2><div class="muted" style="font-size:12px">Cumulative actual scores · descending order</div></div></div><div class="grid">${GAMES.map(gameCard).join("")}</div>`;}
if(tab==="games"){let list=matches.filter(m=>m.game===selectedGame).slice().reverse();v.innerHTML=`<section class="card"><div class="cardhead"><div><h2 class="section-title">Game results</h2><div class="muted" style="font-size:12px">Every match, individual score and finishing position</div></div></div><div class="field"><label for="gameSelect">SELECT GAME</label><select class="select" id="gameSelect">${GAMES.map(g=>`<option ${g===selectedGame?"selected":""}>${esc(g)}</option>`).join("")}</select></div></section>${list.length?list.map((m,i)=>matchCard(m,i)).join(""):`<div class="empty">No ${esc(selectedGame)} matches recorded yet.</div>`}`;}
if(tab==="manage"){v.innerHTML=`<section class="card"><div class="cardhead"><h2 class="section-title">Your game collection</h2><span class="pill">${GAMES.length} games</span></div><p class="muted" style="font-size:13px">Add a new board game once. It will appear for everyone using the shared dashboard.</p><form id="manageGameForm"><div class="field"><label for="gameName">NEW GAME NAME</label><input id="gameName" maxlength="40" placeholder="e.g. Everdell" required></div><div style="height:12px"></div><button class="btn primary" type="submit">Add game to dashboard</button></form><div style="height:18px"></div><div class="rows">${GAMES.map((g,i)=>`<div class="rankrow" style="grid-template-columns:25px minmax(0,1fr) auto;gap:8px"><div class="rank">${i+1}.</div><div class="player">${esc(g)}<div class="muted" style="font-size:11px">${matches.some(m=>m.game===g)?"Has results":DEFAULT_GAMES.includes(g)?"Core game":"Custom game"}</div></div><div style="display:flex;gap:5px;align-items:center"><button class="orderbtn" data-move-game="${esc(g)}" data-direction="-1" aria-label="Move ${esc(g)} up" title="Move up" ${i===0?"disabled":""}>↑</button><button class="orderbtn" data-move-game="${esc(g)}" data-direction="1" aria-label="Move ${esc(g)} down" title="Move down" ${i===GAMES.length-1?"disabled":""}>↓</button>${!matches.some(m=>m.game===g)&&!DEFAULT_GAMES.includes(g)?`<button class="smallbtn danger" data-remove-game="${esc(g)}">Remove</button>`:""}</div></div>`).join("")}</div><p class="note">Use the arrows to change the order. The new order is saved for everyone. Custom games can be removed only when no matches have been recorded for them.</p></section>`;}
if(tab==="add"){v.innerHTML=`<section class="card"><div class="cardhead"><h2 class="section-title">Record a match</h2><span class="pill">All 4 players</span></div><form id="matchForm"><div class="formgrid"><div class="field"><label for="newGame">GAME</label><select class="select" id="newGame">${GAMES.map(g=>`<option ${g===selectedGame?"selected":""}>${esc(g)}</option>`).join("")}</select></div><div class="field"><label for="matchDate">DATE</label><input id="matchDate" type="date" value="${new Date().toLocaleDateString("en-CA")}" required></div></div><div style="height:18px"></div><div class="scoreinputs">${PLAYERS.map((p,i)=>`<div class="field"><label for="score${i}">${esc(p.toUpperCase())} · FINAL SCORE</label><input id="score${i}" type="number" step="any" placeholder="Enter score" required></div>`).join("")}</div><div style="height:18px"></div><button class="btn primary" type="submit">Save match & update leaderboard</button><p class="note">All four players are included in every match. The highest score is ranked first. Scores are added to that game's cumulative total.</p></form></section>`;}
if(tab==="league"){let points=PLAYERS.map((name,i)=>{let played=matches.length,wins=matches.filter(m=>{let max=Math.max(...m.scores);return m.scores[i]===max&&m.scores.filter(x=>x===max).length===1}).length;let lp=matches.reduce((s,m)=>{let score=m.scores[i],higher=m.scores.filter(x=>x>score).length,tied=m.scores.filter(x=>x===score).length;return s+Array.from({length:tied},(_,j)=>4-higher-j).reduce((a,b)=>a+b,0)/tied},0);return{name,lp,wins,played};}).sort((a,b)=>b.lp-a.lp||b.wins-a.wins||a.name.localeCompare(b.name));v.innerHTML=`<section class="card"><h2 class="section-title">Overall league table</h2><p class="muted" style="font-size:12px">Separate cross-game championship using placement points. Raw scores remain game-specific.</p><div class="tablewrap"><table><thead><tr><th>RANK</th><th>PLAYER</th><th class="num">WINS</th><th class="num">MATCHES</th><th class="num">LEAGUE PTS</th></tr></thead><tbody>${points.map((p,i)=>`<tr><td class="winner">${i+1}</td><td>${esc(p.name)}</td><td class="num">${p.wins}</td><td class="num">${p.played}</td><td class="num big">${p.lp.toFixed(1)}</td></tr>`).join("")}</tbody></table></div><p class="note">Placement points: 4, 3, 2, 1. Tied positions split the points for the occupied places.</p></section>`;}
}
async function loadData(){if(refreshing)return;refreshing=true;try{const [g,p,m]=await Promise.all([db.from("games").select("id,name,sort_order").order("sort_order").order("name"),db.from("players").select("id,name").order("id"),db.from("matches").select("id,game_id,played_at,match_scores(player_id,score),games(name)").order("played_at",{ascending:true})]);if(g.error)throw g.error;if(p.error)throw p.error;if(m.error)throw m.error;gameRows=g.data||[];playerRows=p.data||[];GAMES=gameRows.map(x=>x.name);PLAYERS=playerRows.map(x=>x.name);matches=(m.data||[]).map(x=>{const scores=PLAYERS.map(name=>{const pl=playerRows.find(z=>z.name===name);const sc=(x.match_scores||[]).find(z=>z.player_id===pl?.id);return Number(sc?.score??0);});return{id:String(x.id),game:x.games?.name||gameRows.find(z=>z.id===x.game_id)?.name||"Unknown",game_id:x.game_id,date:String(x.played_at).slice(0,10),scores};});if(!GAMES.includes(selectedGame))selectedGame=GAMES[0]||"Catan";render();setStatus(realtimeReady?"● Live · shared with everyone":"● Connected · syncing live updates…", "success");}catch(err){console.error(err);setStatus("Connection error: "+(err.message||"Unable to load league data"),"error");$("#view").innerHTML=`<div class="notice">Couldn't load the shared league data. Check the Supabase table setup and connection, then reload this page.<br><small>${esc(err.message||"")}</small></div>`;}finally{refreshing=false;}}
async function addMatch(game,date,scores){const gid=gameId(game);if(!gid)throw Error("Selected game was not found in the shared database.");const {data:match,error}=await db.from("matches").insert({game_id:gid,played_at:new Date(date+"T12:00:00").toISOString()}).select("id").single();if(error)throw error;const scoreRows=playerRows.map((p,i)=>({match_id:match.id,player_id:p.id,score:scores[i]}));const {error:scoreError}=await db.from("match_scores").insert(scoreRows);if(scoreError){await db.from("matches").delete().eq("id",match.id);throw scoreError;}await loadData();}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{tab=b.dataset.tab;render();}));
$("#view").addEventListener("change",e=>{if(e.target.id==="gameSelect"){selectedGame=e.target.value;render();}});
$("#view").addEventListener("submit",async e=>{if(e.target.id==="manageGameForm"){e.preventDefault();const name=$("#gameName").value.trim();if(!name)return;if(GAMES.some(g=>g.toLowerCase()===name.toLowerCase())){alert("That game is already on your dashboard.");return;}const btn=e.target.querySelector("button");btn.disabled=true;try{const nextOrder=(gameRows.reduce((max,g)=>Math.max(max,Number(g.sort_order)||0),0))+1;const {error}=await db.from("games").insert({name,sort_order:nextOrder});if(error)throw error;selectedGame=name;await loadData();tab="manage";render();}catch(err){alert("Couldn't add game: "+err.message);}finally{btn.disabled=false;}return;}if(e.target.id!=="matchForm")return;e.preventDefault();const scores=PLAYERS.map((_,i)=>Number($("#score"+i).value));if(scores.some(n=>!Number.isFinite(n)))return;const btn=e.target.querySelector("button");btn.disabled=true;try{const game=$("#newGame").value,date=$("#matchDate").value;await addMatch(game,date,scores);selectedGame=game;tab="games";render();}catch(err){alert("Couldn't save match: "+err.message);}finally{btn.disabled=false;}});
$("#view").addEventListener("click",async e=>{let b=e.target.closest("[data-delete]");if(b&&confirm("Delete this match for everyone? This will recalculate the totals.")){b.disabled=true;const {error}=await db.from("matches").delete().eq("id",Number(b.dataset.delete));if(error)alert("Couldn't delete match: "+error.message);await loadData();return;}let mv=e.target.closest("[data-move-game]");if(mv){const from=GAMES.indexOf(mv.dataset.moveGame),to=from+Number(mv.dataset.direction);if(from<0||to<0||to>=GAMES.length)return;const a=gameRows.find(x=>x.name===GAMES[from]),b=gameRows.find(x=>x.name===GAMES[to]);if(!a||!b)return;const {error}=await db.from("games").update({sort_order:b.sort_order}).eq("id",a.id);if(error){alert("Could not reorder games: "+error.message);return;}const {error:error2}=await db.from("games").update({sort_order:a.sort_order}).eq("id",b.id);if(error2){alert("Could not finish reordering: "+error2.message);return;}await loadData();return;}let g=e.target.closest("[data-remove-game]");if(g&&confirm("Remove this game from the shared dashboard?")){const row=gameRows.find(x=>x.name===g.dataset.removeGame);const {error}=await db.from("games").delete().eq("id",row.id);if(error)alert("Couldn't remove game: "+error.message);if(selectedGame===g.dataset.removeGame)selectedGame=GAMES.find(x=>x!==g.dataset.removeGame)||"Catan";await loadData();}});
$("#exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify({version:2,players:PLAYERS,games:GAMES,matches:matches.map(m=>({game:m.game,date:m.date,scores:m.scores}))},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="tabletop-league-backup.json";a.click();URL.revokeObjectURL(a.href);};
$("#importBtn").onclick=()=>$("#importFile").click();
$("#importFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.matches)||!Array.isArray(data.games)||data.matches.some(m=>!data.games.includes(m.game)||!Array.isArray(m.scores)||m.scores.length!==4||m.scores.some(n=>!Number.isFinite(Number(n)))))throw Error("Invalid backup format");if(!confirm("Import this backup into the shared league? Existing match records will be kept; imported records will be added."))return;for(const name of data.games){if(!GAMES.some(g=>g.toLowerCase()===String(name).toLowerCase())){const {error}=await db.from("games").insert({name:String(name)});if(error&&error.code!=="23505")throw error;}}await loadData();for(const m of data.matches)await addMatch(m.game,m.date,m.scores.map(Number));alert("Backup imported into the shared league.");}catch(err){alert("Couldn't import backup: "+err.message);}finally{e.target.value="";}};
$("#playerCount").textContent=PLAYERS.length;
(async()=>{setStatus("Connecting to shared league…");await loadData();const channel=db.channel("tabletop-league-live").on("postgres_changes",{event:"*",schema:"public",table:"games"},()=>loadData()).on("postgres_changes",{event:"*",schema:"public",table:"matches"},()=>loadData()).on("postgres_changes",{event:"*",schema:"public",table:"match_scores"},()=>loadData());channel.subscribe(status=>{if(status==="SUBSCRIBED"){realtimeReady=true;setStatus("● Live · shared with everyone","success");}else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){realtimeReady=false;setStatus("Live connection interrupted · reload to reconnect","error");}});})();

</script>
</body></html>
